[package]
name = "shellproof"
version = "0.2.0"
edition = "2021"
description = "Safe-by-default patch-proof scanner — PHP2Shell (CVE-2026-109618/109619/115560) + Node2Shell (CVE-2026-111497)"
authors = ["VertexElite Security Research <research@vertexelite.io>"]
license = "MIT"
repository = "https://github.com/VertexElite/shellproof"

[[bin]]
name = "shellproof"
path = "src/main.rs"

[dependencies]
tokio        = { version = "1",    features = ["full"] }
reqwest      = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde        = { version = "1",    features = ["derive"] }
serde_json   = "1"
clap         = { version = "4",    features = ["derive"] }
bytes        = "1"
anyhow       = "1"
url          = "2"
rand         = "0.8"
uuid         = { version = "1",    features = ["v4"] }
chrono       = { version = "0.4",  features = ["serde"] }

[profile.release]
opt-level = 3
strip     = true
lto       = true
